[package]
name = "dockgen"
version = "0.1.0"
edition = "2021"
description = "Smart minimal Dockerfile generator — languages, frameworks & multi-service projects"
license = "MIT OR Apache-2.0"
rust-version = "1.75.0"

[[bin]]
name = "dockgen"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
tera = "1.19"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
walkdir = "2.4"
ignore = "0.4"
anyhow = "1.0"
thiserror = "1.0"
colored = "2.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
regex = "1.10"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
